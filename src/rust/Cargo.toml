[package]
name = "turbopick-algo"
version = "0.1.0"
description = "Fuzzy matching algorithm for TurboPick, compiled to WebAssembly"
license = "MIT"
edition = "2024"

[lib]
name = "algo"
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
codegen-units = 1
